version: "3.9"

services:
  web:
    build: .
    command: ["/app/entrypoint.sh"]
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=noctis_pro.settings
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media:/app/media
      - staticfiles:/app/staticfiles
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  worker:
    build: .
    command: ["sh", "-c", "python manage.py migrate && celery -A noctis_pro worker --loglevel=info"]
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=noctis_pro.settings
    volumes:
      - .:/app
      - media:/app/media
    depends_on:
      - redis

volumes:
  media:
  staticfiles:
  redis-data:

